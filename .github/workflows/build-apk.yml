name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install SDK platform and build tools
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            echo "::error::sdkmanager not found at $SDKMANAGER"
            find "$SDK_ROOT" -maxdepth 3 -name sdkmanager -type f 2>/dev/null || true
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret is empty or unset."
            exit 1
          fi

          # Remove any newlines/spaces introduced by copy-paste or wrapping.
          CLEAN=$(printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]')

          case "$CLEAN" in
            *[!A-Za-z0-9+/=]*)
              echo "::error::KEYSTORE_BASE64 contains non-base64 characters. Re-copy the one-line contents of keystore.b64."
              exit 1
              ;;
          esac

          if ! printf '%s' "$CLEAN" | base64 -d > "$RUNNER_TEMP/release.p12"; then
            echo "::error::Failed to base64-decode KEYSTORE_BASE64."
            exit 1
          fi

          SIZE=$(wc -c < "$RUNNER_TEMP/release.p12")
          echo "Decoded keystore: $SIZE bytes"
          if [ "$SIZE" -lt 1000 ]; then
            echo "::error::Decoded keystore is only $SIZE bytes — the secret does not look like the full .p12 file."
            exit 1
          fi

          if [ -n "$KEYSTORE_PASSWORD" ]; then
            if openssl pkcs12 -info -in "$RUNNER_TEMP/release.p12" -passin "pass:$KEYSTORE_PASSWORD" -noout >/dev/null 2>&1; then
              echo "Keystore opens with KEYSTORE_PASSWORD."
            else
              echo "::error::Keystore could not be opened with KEYSTORE_PASSWORD — password mismatch or corrupt file."
              exit 1
            fi
          fi

      - name: Build signed release APK
        env:
          RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/release.p12
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          # Monotonic per-repo run number => in-place updates keep working.
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/NotificationExport.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NotificationExport-apk
          path: out/NotificationExport.apk
          if-no-files-found: error

      - name: Publish stable download link
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          body: |
            Built from commit ${{ github.sha }} (run ${{ github.run_number }}).
            Download: `NotificationExport.apk`
          files: out/NotificationExport.apk
          make_latest: true